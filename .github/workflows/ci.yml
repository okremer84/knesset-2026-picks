name: Laravel and React
on:
  pull_request:
  push:
    branches: [main, codex/laravel-backend]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: testing
          MYSQL_DATABASE: knesset_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ptesting"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, mbstring, pdo_sqlite, pdo_mysql
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run test:frontend
      - run: npm run lint
      - run: npm run build
      - name: SQLite tests
        run: php artisan test
      - name: MySQL tests
        run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: knesset_test
          DB_USERNAME: root
          DB_PASSWORD: testing
      - run: vendor/bin/pint --test
